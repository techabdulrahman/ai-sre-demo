name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: asia-south1          # must match your Artifact Registry location
  IMAGE: asia-south1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/demo/demo-app:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_LOCATION }}

      - name: Build and push image
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
          docker build -t $IMAGE app/
          docker push $IMAGE

      - name: Deploy
        run: |
          kubectl create namespace demo --dry-run=client -o yaml | kubectl apply -f -
          sed -i "s|IMAGE_PLACEHOLDER|$IMAGE|" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl rollout status deployment/demo-app -n demo --timeout=120s