name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: abdulproject-510307
  REGION: asia-south1
  NAMESPACE: ai-troubleshooter
  DEPLOYMENT: ai-k8s-demo
  IMAGE: asia-south1-docker.pkg.dev/abdulproject-510307/demo/demo-app:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/807744285814/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@abdulproject-510307.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      - name: Debug GitHub identity
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Workflow ref: $GITHUB_WORKFLOW_REF"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_LOCATION }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "${IMAGE}" app/
          docker push "${IMAGE}"

      - name: Deploy application
        shell: bash
        run: |
          set -euo pipefail

          kubectl create namespace "${NAMESPACE}" \\
            --dry-run=client -o yaml | kubectl apply -f -

          sed "s|IMAGE_PLACEHOLDER|${IMAGE}|g" k8s/deployment.yaml \\
            | kubectl apply -f -

          kubectl rollout status "deployment/${DEPLOYMENT}" \\
            -n "${NAMESPACE}" --timeout=180s
